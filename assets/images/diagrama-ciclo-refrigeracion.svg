<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" fill="#F5F5F5"/>
  
  <!-- Compresor (arriba) -->
  <circle cx="300" cy="80" r="50" fill="#FF6B00" stroke="#1A1A1A" stroke-width="3"/>
  <text x="300" y="85" font-family="Arial" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">COMPRESOR</text>
  
  <!-- Condensador (derecha) -->
  <rect x="430" y="150" width="120" height="100" fill="#DC3545" stroke="#1A1A1A" stroke-width="3" rx="5"/>
  <text x="490" y="195" font-family="Arial" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CONDENSADOR</text>
  <text x="490" y="215" font-family="Arial" font-size="10" fill="#FFFFFF" text-anchor="middle">Q̇_H (sale)</text>
  
  <!-- Válvula de expansión (abajo) -->
  <path d="M 270 320 L 330 320 L 320 340 L 280 340 Z" fill="#6C757D" stroke="#1A1A1A" stroke-width="2"/>
  <text x="300" y="370" font-family="Arial" font-size="11" font-weight="bold" fill="#1A1A1A" text-anchor="middle">VÁLVULA</text>
  
  <!-- Evaporador (izquierda) -->
  <rect x="50" y="150" width="120" height="100" fill="#007BFF" stroke="#1A1A1A" stroke-width="3" rx="5"/>
  <text x="110" y="195" font-family="Arial" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">EVAPORADOR</text>
  <text x="110" y="215" font-family="Arial" font-size="10" fill="#FFFFFF" text-anchor="middle">Q̇_L (entra)</text>
  
  <!-- Flechas de flujo -->
  <!-- Compresor → Condensador -->
  <line x1="350" y1="80" x2="430" y2="170" stroke="#FF6B00" stroke-width="4"/>
  <polygon points="430,170 420,165 425,175" fill="#FF6B00"/>
  <text x="400" y="120" font-family="Arial" font-size="9" fill="#1A1A1A">Vapor alta P</text>
  
  <!-- Condensador → Válvula -->
  <line x1="490" y1="250" x2="330" y2="320" stroke="#DC3545" stroke-width="4"/>
  <polygon points="330,320 340,315 335,325" fill="#DC3545"/>
  <text x="430" y="300" font-family="Arial" font-size="9" fill="#1A1A1A">Líquido alta P</text>
  
  <!-- Válvula → Evaporador -->
  <line x1="270" y1="330" x2="170" y2="250" stroke="#6C757D" stroke-width="4"/>
  <polygon points="170,250 180,255 175,245" fill="#6C757D"/>
  <text x="200" y="300" font-family="Arial" font-size="9" fill="#1A1A1A">Mezcla L+V baja P</text>
  
  <!-- Evaporador → Compresor -->
  <line x1="110" y1="150" x2="250" y2="80" stroke="#007BFF" stroke-width="4"/>
  <polygon points="250,80 240,85 245,75" fill="#007BFF"/>
  <text x="150" y="110" font-family="Arial" font-size="9" fill="#1A1A1A">Vapor baja P</text>
  
  <!-- Título -->
  <text x="300" y="395" font-family="Arial" font-size="13" font-weight="bold" fill="#1A1A1A" text-anchor="middle">CICLO DE REFRIGERACIÓN - COP = Q_L / Ẇ_compresor</text>
</svg>
