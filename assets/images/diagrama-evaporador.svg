<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="vaporGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#007BFF;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#007BFF;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="400" fill="#F5F5F5"/>
  
  <!-- Cuerpo del evaporador -->
  <rect x="200" y="100" width="200" height="220" fill="#E0E0E0" stroke="#1A1A1A" stroke-width="3" rx="5"/>
  <rect x="210" y="110" width="180" height="200" fill="#FFFFFF" stroke="#C0C0C0" stroke-width="1"/>
  
  <!-- Tubos internos -->
  <g stroke="#808080" stroke-width="2">
    <line x1="230" y1="130" x2="230" y2="290"/>
    <line x1="260" y1="130" x2="260" y2="290"/>
    <line x1="290" y1="130" x2="290" y2="290"/>
    <line x1="320" y1="130" x2="320" y2="290"/>
    <line x1="350" y1="130" x2="350" y2="290"/>
    <line x1="370" y1="130" x2="370" y2="290"/>
  </g>
  
  <!-- Vapor de calefacción (entra por arriba) -->
  <line x1="100" y1="80" x2="250" y2="100" stroke="#FF6B00" stroke-width="6"/>
  <polygon points="250,100 240,95 240,105" fill="#FF6B00"/>
  <text x="150" y="70" font-family="Arial" font-size="11" font-weight="bold" fill="#FF6B00" text-anchor="middle">VAPOR CALEFACCIÓN</text>
  <text x="150" y="85" font-family="Arial" font-size="10" fill="#1A1A1A" text-anchor="middle">(3 bar)</text>
  
  <!-- Condensado (sale por abajo izquierda) -->
  <line x1="250" y1="320" x2="100" y2="340" stroke="#007BFF" stroke-width="5"/>
  <polygon points="100,340 110,335 110,345" fill="#007BFF"/>
  <text x="150" y="360" font-family="Arial" font-size="11" font-weight="bold" fill="#007BFF" text-anchor="middle">CONDENSADO</text>
  
  <!-- Alimentación (entra por la izquierda) -->
  <line x1="50" y1="200" x2="200" y2="200" stroke="#28A745" stroke-width="6"/>
  <polygon points="200,200 190,195 190,205" fill="#28A745"/>
  <text x="100" y="185" font-family="Arial" font-size="11" font-weight="bold" fill="#28A745" text-anchor="middle">ALIMENTACIÓN</text>
  <text x="100" y="200" font-family="Arial" font-size="10" fill="#1A1A1A" text-anchor="middle">(15°Brix)</text>
  
  <!-- Producto concentrado (sale por abajo derecha) -->
  <line x1="350" y1="320" x2="500" y2="340" stroke="#6C757D" stroke-width="6"/>
  <polygon points="500,340 490,335 490,345" fill="#6C757D"/>
  <text x="450" y="360" font-family="Arial" font-size="11" font-weight="bold" fill="#6C757D" text-anchor="middle">PRODUCTO</text>
  <text x="450" y="375" font-family="Arial" font-size="10" fill="#1A1A1A" text-anchor="middle">(65°Brix)</text>
  
  <!-- Vapor secundario (sale por arriba) -->
  <rect x="250" y="20" width="100" height="80" fill="url(#vaporGrad)"/>
  <line x1="300" y1="100" x2="300" y2="20" stroke="#FF6B00" stroke-width="5" stroke-dasharray="5,3"/>
  <text x="300" y="15" font-family="Arial" font-size="11" font-weight="bold" fill="#FF6B00" text-anchor="middle">VAPOR SECUNDARIO</text>
  
  <!-- Etiquetas internas -->
  <text x="300" y="210" font-family="Arial" font-size="12" font-weight="bold" fill="#1A1A1A" text-anchor="middle">EVAPORADOR</text>
  <text x="300" y="225" font-family="Arial" font-size="10" fill="#6C757D" text-anchor="middle">de Efecto Simple</text>
  
  <!-- Título -->
  <text x="300" y="395" font-family="Arial" font-size="12" font-weight="bold" fill="#1A1A1A" text-anchor="middle">Balance: F = S + V | F·xF = S·xS (soluto no volátil)</text>
</svg>
