<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E0E0E0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C0C0C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#808080;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Círculo exterior -->
  <circle cx="200" cy="200" r="190" fill="#1A1A1A" stroke="#FF6B00" stroke-width="4"/>
  <circle cx="200" cy="200" r="180" fill="none" stroke="#C0C0C0" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Engranaje superior izquierdo -->
  <g transform="translate(80, 80)">
    <circle cx="0" cy="0" r="35" fill="url(#metalGrad)" stroke="#1A1A1A" stroke-width="2"/>
    <circle cx="0" cy="0" r="15" fill="#1A1A1A"/>
    <g fill="url(#metalGrad)" stroke="#1A1A1A" stroke-width="1">
      <rect x="-8" y="-45" width="16" height="15" rx="2"/>
      <rect x="-8" y="30" width="16" height="15" rx="2"/>
      <rect x="-45" y="-8" width="15" height="16" rx="2"/>
      <rect x="30" y="-8" width="15" height="16" rx="2"/>
      <rect x="-35" y="-35" width="12" height="12" rx="2" transform="rotate(45)"/>
      <rect x="23" y="-35" width="12" height="12" rx="2" transform="rotate(45)"/>
      <rect x="-35" y="23" width="12" height="12" rx="2" transform="rotate(45)"/>
      <rect x="23" y="23" width="12" height="12" rx="2" transform="rotate(45)"/>
    </g>
  </g>
  
  <!-- Fábrica central -->
  <g transform="translate(140, 100)">
    <!-- Edificio principal -->
    <rect x="0" y="40" width="120" height="80" fill="#2C2C2C" stroke="#FF6B00" stroke-width="2"/>
    <!-- Ventanas -->
    <rect x="10" y="55" width="15" height="20" fill="#FF6B00"/>
    <rect x="35" y="55" width="15" height="20" fill="#FF6B00"/>
    <rect x="60" y="55" width="15" height="20" fill="#FF6B00"/>
    <rect x="85" y="55" width="15" height="20" fill="#FF6B00"/>
    <rect x="10" y="85" width="15" height="20" fill="#C0C0C0"/>
    <rect x="35" y="85" width="15" height="20" fill="#C0C0C0"/>
    <rect x="60" y="85" width="15" height="20" fill="#C0C0C0"/>
    <rect x="85" y="85" width="15" height="20" fill="#C0C0C0"/>
    <!-- Chimeneas -->
    <rect x="20" y="10" width="12" height="30" fill="url(#metalGrad)" stroke="#1A1A1A" stroke-width="1"/>
    <rect x="50" y="5" width="12" height="35" fill="url(#metalGrad)" stroke="#1A1A1A" stroke-width="1"/>
    <rect x="80" y="15" width="12" height="25" fill="url(#metalGrad)" stroke="#1A1A1A" stroke-width="1"/>
    <!-- Humo -->
    <g fill="#C0C0C0" opacity="0.7">
      <ellipse cx="26" cy="5" rx="8" ry="5"/>
      <ellipse cx="56" cy="0" rx="10" ry="6"/>
      <ellipse cx="86" cy="10" rx="7" ry="4"/>
    </g>
  </g>
  
  <!-- Brazo robótico derecho -->
  <g transform="translate(280, 120)">
    <circle cx="0" cy="0" r="15" fill="#FF6B00" stroke="#1A1A1A" stroke-width="2"/>
    <line x1="0" y1="0" x2="40" y2="-30" stroke="#FF6B00" stroke-width="8" stroke-linecap="round"/>
    <circle cx="40" cy="-30" r="10" fill="#C0C0C0" stroke="#1A1A1A" stroke-width="2"/>
    <line x1="40" y1="-30" x2="70" y2="-10" stroke="#C0C0C0" stroke-width="6" stroke-linecap="round"/>
    <path d="M 70 -10 L 85 -20 L 90 -15 L 80 -5 Z" fill="#1A1A1A" stroke="#FF6B00" stroke-width="1"/>
  </g>
  
  <!-- Texto PROCESOS -->
  <text x="200" y="240" font-family="Arial Black, sans-serif" font-size="42" font-weight="900" fill="#FFFFFF" text-anchor="middle" stroke="#1A1A1A" stroke-width="1">PROCESOS</text>
  
  <!-- Texto INDUSTRIALES -->
  <text x="200" y="285" font-family="Arial Black, sans-serif" font-size="36" font-weight="900" fill="url(#orangeGrad)" text-anchor="middle" stroke="#1A1A1A" stroke-width="1">INDUSTRIALES</text>
  
  <!-- Subtítulo -->
  <text x="200" y="315" font-family="Arial, sans-serif" font-size="16" font-style="italic" fill="#C0C0C0" text-anchor="middle">Innovación y Eficiencia</text>
  
  <!-- Banda inferior -->
  <path d="M 50 340 L 350 340 L 340 360 L 60 360 Z" fill="url(#metalGrad)" stroke="#1A1A1A" stroke-width="2"/>
  <text x="200" y="355" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1A1A1A" text-anchor="middle">Aprende • Construye • Transforma</text>
  
  <!-- Decoración inferior -->
  <path d="M 100 370 L 300 370 L 280 385 L 120 385 Z" fill="#FF6B00" opacity="0.8"/>
</svg>
