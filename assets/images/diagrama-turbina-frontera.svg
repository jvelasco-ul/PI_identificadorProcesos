<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E0E0E0"/>
      <stop offset="100%" style="stop-color:#808080"/>
    </linearGradient>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#FF6B00"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#007BFF"/>
    </marker>
  </defs>
  
  <!-- Fondo -->
  <rect width="600" height="400" fill="#F5F5F5"/>
  
  <!-- Frontera (línea punteada roja) -->
  <rect x="150" y="50" width="300" height="300" fill="none" stroke="#DC3545" stroke-width="3" stroke-dasharray="10,5" rx="10"/>
  <text x="300" y="40" font-family="Arial" font-size="14" font-weight="bold" fill="#DC3545" text-anchor="middle">FRONTERA DEL SISTEMA</text>
  
  <!-- Turbina (cuerpo principal) -->
  <ellipse cx="300" cy="200" rx="100" ry="80" fill="url(#metalGrad)" stroke="#1A1A1A" stroke-width="3"/>
  <ellipse cx="300" cy="200" rx="60" ry="50" fill="#2C2C2C" stroke="#FF6B00" stroke-width="2"/>
  
  <!-- Álabes de la turbina -->
  <g stroke="#C0C0C0" stroke-width="3" stroke-linecap="round">
    <line x1="300" y1="150" x2="300" y2="250"/>
    <line x1="250" y1="200" x2="350" y2="200"/>
    <line x1="265" y1="165" x2="335" y2="235"/>
    <line x1="335" y1="165" x2="265" y2="235"/>
  </g>
  <circle cx="300" cy="200" r="15" fill="#FF6B00" stroke="#1A1A1A" stroke-width="2"/>
  
  <!-- Eje de salida (trabajo) -->
  <line x1="400" y1="200" x2="500" y2="200" stroke="#1A1A1A" stroke-width="6"/>
  <rect x="480" y="180" width="40" height="40" fill="#FF6B00" stroke="#1A1A1A" stroke-width="2" rx="5"/>
  <text x="500" y="205" font-family="Arial" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle"></text>
  <text x="500" y="240" font-family="Arial" font-size="11" fill="#1A1A1A" text-anchor="middle">Trabajo de eje</text>
  
  <!-- Entrada de vapor (alta P/T) -->
  <line x1="50" y1="120" x2="200" y2="170" stroke="#FF6B00" stroke-width="8" marker-end="url(#arrowOrange)"/>
  <text x="120" y="100" font-family="Arial" font-size="12" font-weight="bold" fill="#FF6B00" text-anchor="middle">VAPOR ENTRADA</text>
  <text x="120" y="115" font-family="Arial" font-size="10" fill="#1A1A1A" text-anchor="middle">10 MPa, 500°C</text>
  
  <!-- Salida de vapor (baja P/T) -->
  <line x1="200" y1="280" x2="80" y2="320" stroke="#007BFF" stroke-width="8" marker-end="url(#arrowBlue)"/>
  <text x="130" y="340" font-family="Arial" font-size="12" font-weight="bold" fill="#007BFF" text-anchor="middle">VAPOR SALIDA</text>
  <text x="130" y="355" font-family="Arial" font-size="10" fill="#1A1A1A" text-anchor="middle">10 kPa, 45°C</text>
  
  <!-- Etiquetas -->
  <text x="300" y="380" font-family="Arial" font-size="13" font-weight="bold" fill="#1A1A1A" text-anchor="middle">TURBINA DE VAPOR - Sistema Abierto en Estado Estacionario</text>
  
  <!-- Leyenda -->
  <rect x="20" y="20" width="15" height="3" fill="#DC3545"/>
  <text x="40" y="25" font-family="Arial" font-size="10" fill="#1A1A1A">= Frontera</text>
</svg>
