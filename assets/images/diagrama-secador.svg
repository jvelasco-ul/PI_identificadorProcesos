<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" fill="#F5F5F5"/>
  
  <!-- Cuerpo del secador rotatorio -->
  <ellipse cx="300" cy="200" rx="180" ry="80" fill="#C0C0C0" stroke="#1A1A1A" stroke-width="3"/>
  <ellipse cx="300" cy="200" rx="160" ry="65" fill="#E0E0E0" stroke="#808080" stroke-width="2"/>
  
  <!-- Líneas de rotación -->
  <g stroke="#808080" stroke-width="1" stroke-dasharray="3,3">
    <line x1="140" y1="200" x2="460" y2="200"/>
    <line x1="300" y1="135" x2="300" y2="265"/>
  </g>
  
  <text x="300" y="205" font-family="Arial" font-size="14" font-weight="bold" fill="#1A1A1A" text-anchor="middle">SECADOR ROTATORIO</text>
  
  <!-- Entrada mineral húmedo (izquierda) -->
  <line x1="30" y1="180" x2="140" y2="190" stroke="#8B4513" stroke-width="8"/>
  <polygon points="140,190 130,185 130,195" fill="#8B4513"/>
  <text x="85" y="170" font-family="Arial" font-size="11" font-weight="bold" fill="#8B4513" text-anchor="middle">MINERAL HÚMEDO</text>
  <text x="85" y="185" font-family="Arial" font-size="10" fill="#1A1A1A" text-anchor="middle">20% humedad</text>
  <text x="85" y="200" font-family="Arial" font-size="10" fill="#1A1A1A" text-anchor="middle">100 ton/h</text>
  
  <!-- Salida mineral seco (derecha) -->
  <line x1="460" y1="210" x2="570" y2="220" stroke="#D2691E" stroke-width="8"/>
  <polygon points="570,220 560,215 560,225" fill="#D2691E"/>
  <text x="515" y="240" font-family="Arial" font-size="11" font-weight="bold" fill="#D2691E" text-anchor="middle">MINERAL SECO</text>
  <text x="515" y="255" font-family="Arial" font-size="10" fill="#1A1A1A" text-anchor="middle">5% humedad</text>
  <text x="515" y="270" font-family="Arial" font-size="10" fill="#1A1A1A" text-anchor="middle">~84.2 ton/h</text>
  
  <!-- Entrada aire caliente (arriba) -->
  <line x1="200" y1="50" x2="250" y2="135" stroke="#FF6B00" stroke-width="6"/>
  <polygon points="250,135 240,130 245,140" fill="#FF6B00"/>
  <text x="200" y="40" font-family="Arial" font-size="11" font-weight="bold" fill="#FF6B00" text-anchor="middle">AIRE CALIENTE</text>
  <text x="200" y="55" font-family="Arial" font-size="10" fill="#1A1A1A" text-anchor="middle">(gas natural)</text>
  
  <!-- Salida aire húmedo (arriba derecha) -->
  <line x1="350" y1="135" x2="420" y2="50" stroke="#007BFF" stroke-width="6"/>
  <polygon points="420,50 410,55 415,45" fill="#007BFF"/>
  <text x="420" y="40" font-family="Arial" font-size="11" font-weight="bold" fill="#007BFF" text-anchor="middle">AIRE HÚMEDO</text>
  <text x="420" y="55" font-family="Arial" font-size="10" fill="#1A1A1A" text-anchor="middle">(con vapor)</text>
  
  <!-- Agua evaporada (flecha hacia arriba) -->
  <line x1="300" y1="135" x2="300" y2="80" stroke="#00BFFF" stroke-width="4" stroke-dasharray="5,3"/>
  <polygon points="300,80 295,90 305,90" fill="#00BFFF"/>
  <text x="340" y="90" font-family="Arial" font-size="10" fill="#00BFFF">≈15.8 ton/h H₂O</text>
  
  <!-- Título -->
  <text x="300" y="320" font-family="Arial" font-size="13" font-weight="bold" fill="#1A1A1A" text-anchor="middle">SECADO DE MINERAL DE COBRE (Southern Copper / Antamina)</text>
  <text x="300" y="345" font-family="Arial" font-size="11" fill="#1A1A1A" text-anchor="middle">Balance agua: m_AS·(H₂ - H₁) = m_SS·(X₁ - X₂)</text>
  <text x="300" y="370" font-family="Arial" font-size="10" fill="#6C757D" text-anchor="middle">Eficiencia energética típica: 30-50% | Ineficiencia 10% = US$ 1-2 M/año</text>
</svg>
